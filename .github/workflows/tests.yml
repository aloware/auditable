name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.stability }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12', '13']
        stability: [prefer-stable]
        include:
          # Guard the declared lower bounds so `^12.0` stays honest.
          - php: '8.2'
            laravel: '12'
            stability: prefer-lowest
          - php: '8.3'
            laravel: '13'
            stability: prefer-lowest
        exclude:
          # Laravel 13 requires PHP 8.3 or newer.
          - php: '8.2'
            laravel: '13'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, sqlite3, pdo_sqlite, mbstring
          coverage: none

      - name: Select the Laravel version under test
        # Testbench transitively pins laravel/framework, so constraining it is
        # enough to pick the Laravel major for this leg.
        run: |
          if [ "${{ matrix.laravel }}" = "13" ]; then
            echo 'TESTBENCH=^11.0' >> "$GITHUB_ENV"
          else
            echo 'TESTBENCH=^10.0' >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: |
          composer update \
            --with="orchestra/testbench:${TESTBENCH}" \
            --${{ matrix.stability }} \
            --prefer-dist --no-interaction --no-progress

      - name: Report the resolved versions
        run: composer show laravel/framework orchestra/testbench | grep -E '^(name|versions)'

      - name: Run tests
        run: vendor/bin/phpunit

  lint:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, sqlite3, pdo_sqlite, mbstring
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: composer lint

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Audit for known vulnerabilities
        run: composer audit
